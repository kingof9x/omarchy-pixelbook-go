# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
    if [ "${grub_cpu}" == 'x86_64' ]; then
        archiso_platform="x64 ${archiso_platform}"
    elif [ "${grub_cpu}" == 'i386' ]; then
        archiso_platform="IA32 ${archiso_platform}"
    else
        archiso_platform="${grub_cpu} ${archiso_platform}"
    fi
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu} ${grub_platform}"
fi

# Set default menu entry
# EDITED: show the menu for 15 seconds instead of hiding it
default=archlinux
timeout=15
timeout_style=menu


# Menu entries

# One image boots every board. A Snapdragon laptop's firmware provides no device
# tree, so where the build made a UKI that carries them, such a laptop boots
# that by default and every other machine boots the kernel directly. The
# processor's SMBIOS record tells them apart. The UKI starts Qualcomm firmware
# before searching USB media when its files are present. Keep automatic loading
# blocked for boards that need the legacy path: startup can reconfigure USB-C.
# Device memory access is translated: under a kernel's passthrough default the
# Yoga Slim 7x's keyboard and touchpad never appear.
if [ "${grub_cpu}" == 'arm64' -a -f '/arch/boot/x86_64/omarchy-live.efi' ]; then
    insmod smbios
    smbios --type 4 --get-string 7 --set cpu_maker
    smbios --type 4 --get-string 16 --set cpu_name
    if regexp 'Qualcomm' "${cpu_maker}"; then
        default=archlinux-uki
    elif regexp 'Snapdragon' "${cpu_name}"; then
        default=archlinux-uki
    fi
    menuentry "Omarchy (x86_64, ${archiso_platform}, device tree)" --class arch --class gnu-linux --class gnu --class os --id 'archlinux-uki' {
        chainloader /arch/boot/x86_64/omarchy-live.efi archisobasedir=arch archisosearchuuid=2026-10-19-22-18-53-00 quiet splash initramfs_async=0 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0 iommu.passthrough=0 modprobe.blacklist=qcom_q6v5_pas omarchy.qcom_early=1
    }
fi

menuentry "Omarchy (x86_64, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-t2 archisobasedir=arch archisosearchuuid=2026-10-19-22-18-53-00 quiet splash xe.enable_panel_replay=0 initramfs_async=0
    initrd /arch/boot/x86_64/initramfs-linux-t2.img
}

# EDITED: added - Intel panel self refresh turned off (try this first)
menuentry "Omarchy - no PSR (try first)" --class arch --class gnu-linux --class gnu --class os --id 'archlinux-nopsr' {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-t2 archisobasedir=arch archisosearchuuid=2026-10-19-22-18-53-00 quiet splash xe.enable_panel_replay=0 initramfs_async=0 i915.enable_psr=0
    initrd /arch/boot/x86_64/initramfs-linux-t2.img
}

# EDITED: added - safe graphics, same as Fedora's basic graphics mode
menuentry "Omarchy - safe graphics (nomodeset)" --class arch --class gnu-linux --class gnu --class os --id 'archlinux-safe' {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-t2 archisobasedir=arch archisosearchuuid=2026-10-19-22-18-53-00 quiet splash xe.enable_panel_replay=0 initramfs_async=0 nomodeset
    initrd /arch/boot/x86_64/initramfs-linux-t2.img
}

menuentry "Omarchy with speakup screen reader (x86_64, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux-t2 archisobasedir=arch archisosearchuuid=2026-10-19-22-18-53-00 accessibility=on xe.enable_panel_replay=0 initramfs_async=0
    initrd /arch/boot/x86_64/initramfs-linux-t2.img
}



if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == "i386" -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
